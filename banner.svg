<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#0f141c" />
      <stop offset="100%" stop-color="#070a0e" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1b2430" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Scanline Filter / Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Panel -->
  <rect width="920" height="280" rx="12" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="1.5" />
  <rect width="920" height="280" rx="12" fill="url(#grid)" />

  <!-- Top Terminal Header Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 908 0 Q 920 0 920 12 L 920 38 L 0 38 Z" fill="#111827" fill-opacity="0.8" />
  <line x1="0" y1="38" x2="920" y2="38" stroke="#1f2937" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="19" r="6" fill="#f87171" fill-opacity="0.8" />
  <circle cx="44" cy="19" r="6" fill="#fbbf24" fill-opacity="0.8" />
  <circle cx="64" cy="19" r="6" fill="#34d399" fill-opacity="0.8" />

  <!-- Terminal Title -->
  <text x="460" y="24" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#6b7280" font-weight="600" letter-spacing="1.5">
    PRYAN // KERNEL-USERSPACE EXPERIMENTAL WORKBENCH
  </text>

  <!-- Live Status Badge Top Right -->
  <rect x="800" y="10" width="102" height="18" rx="9" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8" />
  <circle cx="812" cy="19" r="3.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="822" y="23" font-family="monospace" font-size="10" fill="#34d399" font-weight="600">QEMU ACTIVE</text>

  <!-- Main Hero Text Section -->
  <g transform="translate(40, 75)">
    <!-- Kanji Sub-badge -->
    <rect x="0" y="0" width="54" height="22" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="27" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#00f0ff" font-weight="700">黒鉄</text>

    <!-- Name / Title -->
    <text x="66" y="16" font-family="'JetBrains Mono', monospace" font-size="15" fill="#9ca3af" font-weight="500">
      devpryan7792 <tspan fill="#4b5563">::</tspan> systems &amp; runtime tinkerer
    </text>

    <!-- Huge Glowing Statement -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f9fafb" letter-spacing="-0.5">
      Building from Bare Metal to Wayland.
    </text>

    <!-- Subtitle description -->
    <text x="0" y="98" font-family="'JetBrains Mono', monospace" font-size="13" fill="#60a5fa" letter-spacing="0.5">
      Immutable EROFS appliances · Zero-allocation sandboxes · Micro-supervisors
    </text>
  </g>

  <!-- Bottom Architecture Pipeline HUD -->
  <g transform="translate(40, 195)">
    <!-- Node 1: kurogane-init -->
    <rect x="0" y="0" width="180" height="52" rx="8" fill="#111827" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.8" />
    <text x="16" y="22" font-family="monospace" font-size="11" fill="#00f0ff" font-weight="700">PID 1 / kurogane-init</text>
    <text x="16" y="38" font-family="monospace" font-size="10" fill="#6b7280">static Rust · epoll/signal</text>

    <!-- Arrow 1 -->
    <path d="M 188 26 L 220 26 M 214 21 L 221 26 L 214 31" stroke="#3b82f6" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Node 2: seatd + cage -->
    <rect x="228" y="0" width="180" height="52" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.8" />
    <text x="244" y="22" font-family="monospace" font-size="11" fill="#60a5fa" font-weight="700">Wayland Mediation</text>
    <text x="244" y="38" font-family="monospace" font-size="10" fill="#6b7280">cage compositor + seatd</text>

    <!-- Arrow 2 -->
    <path d="M 416 26 L 448 26 M 442 21 L 449 26 L 442 31" stroke="#3b82f6" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Node 3: immutable root -->
    <rect x="456" y="0" width="180" height="52" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.8" />
    <text x="472" y="22" font-family="monospace" font-size="11" fill="#a78bfa" font-weight="700">Immutable Root</text>
    <text x="472" y="38" font-family="monospace" font-size="10" fill="#6b7280">pure EROFS (lz4hc,12)</text>

    <!-- Telemetry Tag / Boot Metric Box -->
    <rect x="656" y="0" width="184" height="52" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 2" />
    <text x="672" y="22" font-family="monospace" font-size="11" fill="#34d399" font-weight="700">COLD BOOT SLA</text>
    <text x="672" y="39" font-family="monospace" font-size="13" fill="#ffffff" font-weight="800">&lt; 1.8s <tspan font-size="10" fill="#9ca3af" font-weight="400">under QEMU/KVM</tspan></text>
  </g>
</svg>
